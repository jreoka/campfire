[package]
name = "campfire"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "Campfire desktop/mobile app (chat + voice wrapper)"

[lib]
name = "campfire_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS notifications for the desktop shells only — the Android shell has its own
# Kotlin notification service (gen/android .../PushService.kt), so the plugin
# stays out of the APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = "2"

# Raw Run-key reads on Windows only: lets the app tell a deleted autostart
# entry (NSIS uninstaller on manual upgrades — healed) from one the user
# disabled in Task Manager (respected). Already in the tree via auto-launch.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10"
