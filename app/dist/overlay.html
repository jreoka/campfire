<!doctype html>
<!-- Campfire in-call overlay.
  A tiny always-on-top, click-through window (owned by the Rust shell) that
  floats over fullscreen games during voice calls. The page's voice code
  pushes speaker snapshots to the `overlay_update` command; the shell repaints
  this page through the `overlay-speakers` event. Incoming chat messages
  arrive through the `overlay_message` command and are repainted here through
  the `overlay-message` event as little toast cards. Bundled with the app in
  app/dist so it never depends on the site deploy.

  Only participants who are CURRENTLY speaking get a row: a row fades in when
  someone starts talking and fades back out when they stop. Rows are keyed by
  speaker id so a re-render never rebuilds a row that is already on screen.
  Message toasts stack below the speaker rows (max 3), each fading away after
  a few seconds. The page owns the row/toast lifecycle, so it also owns the
  panel height: after every change it reports its scrollHeight to the shell's
  `overlay_fit` command, which resizes (and re-anchors) the window. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #ov { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
  .sp {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 5px; color: #fff;
    /* No pill behind the row: the avatar and name float directly over the
       game. The resting state is invisible: rows fade in on `.in` and fade
       back to this when the speaker stops, before being removed from the
       DOM. Opacity only — no slide or scale — so a row fades in place
       instead of drifting as it fades. */
    opacity: 0;
    transition: opacity 0.28s ease-out;
  }
  .sp.in { opacity: 1; }
  .av {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; background: #555;
    overflow: hidden; border: 2px solid #3ba55d; box-sizing: border-box;
    box-shadow: 0 0 8px rgba(59, 165, 93, 0.8);
  }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sp.muted .av { border-color: transparent; box-shadow: none; }
  .nm {
    font-size: 13px; line-height: 1.2; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    /* No pill behind the row any more, so the name floats over the game
       itself: a soft shadow keeps it readable over bright scenes. */
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.6);
  }
  .mt {
    margin-left: auto; flex: none; opacity: 0.7;
    display: flex; align-items: center;
  }
  /* --- message toasts: a bordered card with the sender's pfp, name, where
     the message is from, and a short preview. Unlike speaker rows these sit
     on a dark card so the text stays readable over the game. --- */
  #msgs { display: flex; flex-direction: column; gap: 6px; }
  .msg {
    display: flex; gap: 8px; align-items: flex-start;
    background: rgba(17, 19, 25, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    padding: 7px 10px 7px 7px; color: #fff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    opacity: 0; transform: translateY(-5px);
    transition: opacity 0.25s ease-out, transform 0.25s ease-out;
  }
  .msg.in { opacity: 1; transform: none; }
  .msg .av {
    width: 30px; height: 30px; font-size: 13px; border: none; box-shadow: none;
  }
  .msg .bd { flex: 1; min-width: 0; }
  .msg .hd { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .msg .nm {
    font-size: 12px; font-weight: 700; text-shadow: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg .src {
    margin-left: auto; flex: none; max-width: 45%;
    font-size: 10.5px; color: rgba(255, 255, 255, 0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg .tx {
    margin-top: 1px; font-size: 12px; line-height: 1.35;
    color: rgba(255, 255, 255, 0.85);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: break-word;
  }
</style>
</head>
<body>
<div id="ov"><div id="msgs"></div></div>
<script>
'use strict';
var ov = document.getElementById('ov');
var msgsBox = document.getElementById('msgs');
// id -> { el, fadeTimer }. A row with a pending fadeTimer is still in the DOM
// (fading out); if its speaker starts talking again the removal is cancelled.
var rows = new Map();
var FADE_MS = 300;
var MAX_ROWS = 12;
// Message toasts: newest at the bottom, max 3 on screen, each lives 8s.
var MSG_MS = 8000;
var MAX_MSGS = 3;
var msgCount = 0;

function fit() {
  var T = window.__TAURI__;
  if (T && T.core && typeof T.core.invoke === 'function') {
    T.core.invoke('overlay_fit', { height: ov.scrollHeight }).catch(function () {});
  }
}

function avatarEl(s, cls) {
  var av = document.createElement('div');
  av.className = cls || 'av';
  var name = s.name || '?';
  if (s.avatar_url) {
    var img = document.createElement('img');
    img.src = s.avatar_url; img.alt = ''; img.draggable = false;
    img.onerror = function () { img.remove(); av.textContent = name.slice(0, 1).toUpperCase(); };
    av.appendChild(img);
  } else {
    av.textContent = name.slice(0, 1).toUpperCase();
    av.style.background = s.avatar_color || '#555';
  }
  return av;
}

function buildRow(s) {
  var row = document.createElement('div');
  row.className = 'sp';
  row.appendChild(avatarEl(s));
  var nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = s.name || '?';
  row.appendChild(nm);
  if (s.muted) {
    row.classList.add('muted');
    var mt = document.createElement('span');
    mt.className = 'mt';
    mt.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>';
    row.appendChild(mt);
  }
  return row;
}

// Only speaking participants are shown. Everyone else (idle, muted, just
// listening) stays out of the panel entirely.
function render(speakers) {
  var seen = Object.create(null);
  var seenCount = 0;
  var list = speakers || [];
  for (var i = 0; i < list.length && seenCount < MAX_ROWS; i++) {
    var s = list[i];
    if (!s || !s.speaking) continue;
    var id = String(s.id || s.name || i);
    seen[id] = true;
    seenCount++;
    var r = rows.get(id);
    if (r) {
      // Back while fading out: cancel the removal and keep the row.
      if (r.fadeTimer) { clearTimeout(r.fadeTimer); r.fadeTimer = null; }
      r.el.classList.add('in');
      var nm = r.el.querySelector('.nm');
      if (nm && nm.textContent !== (s.name || '?')) nm.textContent = s.name || '?';
      r.el.classList.toggle('muted', !!s.muted);
    } else {
      var el = buildRow(s);
      ov.insertBefore(el, msgsBox);
      rows.set(id, { el: el, fadeTimer: null });
      // Paint the resting state first so the transition to `.in` animates.
      requestAnimationFrame((function (node) {
        return function () { node.classList.add('in'); };
      })(el));
    }
  }
  rows.forEach(function (r, id) {
    if (seen[id] || r.fadeTimer) return;
    r.el.classList.remove('in');
    r.fadeTimer = setTimeout((function (key, node) {
      return function () {
        node.remove();
        var cur = rows.get(key);
        if (cur && cur.el === node) rows.delete(key);
        fit();
      };
    })(id, r.el), FADE_MS);
  });
  fit();
}

function removeToast(el) {
  if (!el || !el.parentNode) return;
  el.classList.remove('in');
  setTimeout(function () {
    if (el.parentNode) el.parentNode.removeChild(el);
    msgCount = Math.max(0, msgCount - 1);
    fit();
  }, FADE_MS);
}

function toast(m) {
  if (!m) return;
  // Cap the stack: a burst of messages drops the oldest, newest stays.
  while (msgCount >= MAX_MSGS && msgsBox.firstChild) {
    var old = msgsBox.firstChild;
    if (old.parentNode) old.parentNode.removeChild(old);
    msgCount--;
  }
  var el = document.createElement('div');
  el.className = 'msg';
  el.appendChild(avatarEl(m));
  var bd = document.createElement('div');
  bd.className = 'bd';
  var hd = document.createElement('div');
  hd.className = 'hd';
  var nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = m.name || '?';
  hd.appendChild(nm);
  if (m.source) {
    var src = document.createElement('div');
    src.className = 'src';
    src.textContent = m.source;
    hd.appendChild(src);
  }
  bd.appendChild(hd);
  var tx = document.createElement('div');
  tx.className = 'tx';
  tx.textContent = m.text || '';
  bd.appendChild(tx);
  el.appendChild(bd);
  msgsBox.appendChild(el);
  msgCount++;
  requestAnimationFrame(function () { el.classList.add('in'); });
  fit();
  setTimeout(function () { removeToast(el); }, MSG_MS);
}

async function boot() {
  var T = window.__TAURI__;
  if (!T) return;
  if (T.event && typeof T.event.listen === 'function') {
    try {
      await T.event.listen('overlay-speakers', function (e) {
        render((e.payload && e.payload.speakers) || []);
      });
    } catch (err) {}
    try {
      await T.event.listen('overlay-message', function (e) {
        toast(e.payload || null);
      });
    } catch (err) {}
  }
  // Pull the current snapshot in case the window was created after the last
  // push (the shell only emits on change). Message toasts are transient, so
  // only the speaker snapshot is pulled.
  try {
    var st = await T.core.invoke('overlay_state');
    if (st && st.in_call) render(st.speakers || []);
  } catch (err) {}
}
boot();
</script>
</body>
</html>
