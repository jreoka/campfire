name: Windows app build

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version from commit hash
        shell: pwsh
        run: |
          # The commit short hash is the version — no semver anywhere.
          $short = 'unknown'
          if ($env:GITHUB_SHA -and $env:GITHUB_SHA.Length -ge 7) { $short = $env:GITHUB_SHA.Substring(0, 7) }
          echo "APP_VERSION=$short" >> $env:GITHUB_ENV
          echo "SHORT_SHA=$short" >> $env:GITHUB_ENV
          Write-Host "Resolved version: $short"
      - name: Install npm deps
        working-directory: app
        run: npm install
      - name: Build Tauri app
        working-directory: app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: campfire-app
          path: app/src-tauri/target/release/bundle/**
      - name: Compute release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (($env:GITHUB_REF_TYPE -eq 'tag') -and ($tag -like 'app-*')) {
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          } else {
            echo "RELEASE_TAG=app-$env:SHORT_SHA" >> $env:GITHUB_ENV
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Campfire Windows app ${{ env.APP_VERSION }}
          body: "Campfire Windows app (commit ${{ env.SHORT_SHA }}, code is unsigned — expect a SmartScreen warning on first run)."
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/campfire.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
