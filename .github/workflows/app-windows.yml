name: Windows app build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (ignored if version is set)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version override, e.g. 0.2.0 (leave empty to auto-increment)'
        required: false
        default: ''
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the version can auto-increment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match '^app-v(.+)$') {
            # Tag push: release exactly the tagged version.
            $ver = $matches[1]
          } elseif ($env:INPUT_VERSION) {
            # Explicit manual override.
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version input: $($env:INPUT_VERSION) (expected X.Y.Z)"
            }
            $ver = $env:INPUT_VERSION
          } else {
            # Auto-increment: start from the higher of the repo files and the
            # latest app-v* tag (tags look like app-v0.1.3 or app-v0.1.3-a3f9c2).
            # If that version was never released, use it as-is; otherwise bump
            # it (patch/minor/major) to the next free version.
            git fetch --tags --quiet
            $allTags = @(git tag --list 'app-v*')
            $base = '0.1.0'
            try {
              $fileVer = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
              if ($fileVer -match '^\d+\.\d+\.\d+$') { $base = $fileVer }
            } catch { }
            $latest = $null
            foreach ($t in $allTags) {
              if ($t -match '^app-v(\d+\.\d+\.\d+)(-[0-9a-f]+)?$') {
                $v = New-Object System.Version($matches[1])
                if ($null -eq $latest -or $v -gt $latest) { $latest = $v }
              }
            }
            $start = New-Object System.Version($base)
            if ($null -ne $latest -and $latest -gt $start) { $start = $latest }
            $bumped = $false
            while ($true) {
              $rx = '^app-v' + [regex]::Escape($start.ToString()) + '(-[0-9a-f]+)?$'
              $taken = $false
              foreach ($t in $allTags) {
                if ($t -match $rx) { $taken = $true; break }
              }
              if (-not $taken) { break }
              if (-not $bumped) {
                switch ($env:INPUT_BUMP) {
                  'major' { $start = New-Object System.Version(($start.Major + 1), 0, 0) }
                  'minor' { $start = New-Object System.Version($start.Major, ($start.Minor + 1), 0) }
                  default { $start = New-Object System.Version($start.Major, $start.Minor, ($start.Build + 1)) }
                }
                $bumped = $true
              } else {
                $start = New-Object System.Version($start.Major, $start.Minor, ($start.Build + 1))
              }
            }
            $ver = $start.ToString()
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $ver" }
          # Short commit hash identifies the exact build in tags and releases.
          $short = 'unknown'
          if ($env:GITHUB_SHA -and $env:GITHUB_SHA.Length -ge 6) { $short = $env:GITHUB_SHA.Substring(0, 6) }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          echo "SHORT_SHA=$short" >> $env:GITHUB_ENV
          Write-Host "Resolved version: $ver ($short)"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
      - name: Bump version in source files
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          # Cargo.toml
          $ct = Get-Content app/src-tauri/Cargo.toml -Raw
          $ct = $ct -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`""
          Set-Content app/src-tauri/Cargo.toml $ct -NoNewline
          # tauri.conf.json
          $tc = Get-Content app/src-tauri/tauri.conf.json -Raw
          $tc = $tc -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content app/src-tauri/tauri.conf.json $tc -NoNewline
          # package.json
          $pj = Get-Content app/package.json -Raw
          $pj = $pj -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content app/package.json $pj -NoNewline
          Write-Host "Version bumped to $ver"
      - name: Install npm deps
        working-directory: app
        run: npm install
      - name: Build Tauri app
        working-directory: app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: campfire-app
          path: app/src-tauri/target/release/bundle/**
      - name: Compute release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match '^app-v.+$') {
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          } else {
            echo "RELEASE_TAG=app-v$env:APP_VERSION-$env:SHORT_SHA" >> $env:GITHUB_ENV
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Campfire Windows app v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          body: "Campfire Windows app v${{ env.APP_VERSION }} (commit ${{ env.SHORT_SHA }}, code is unsigned — expect a SmartScreen warning on first run)."
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/campfire.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit version bump back to main
        # Keeps Cargo.toml / tauri.conf.json / package.json in sync so local
        # builds and the next auto-increment start from the released version.
        # Tag-triggered runs are skipped (detached HEAD). Never fails the run:
        # the release itself is already published by this point.
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/Cargo.toml app/src-tauri/tauri.conf.json app/package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Version files already in sync, nothing to commit."
          } else {
            $branch = $env:GITHUB_REF_NAME
            git commit -m "chore(windows-app): bump version to $env:APP_VERSION ($env:SHORT_SHA)"
            git fetch origin $branch
            git rebase "origin/$branch"
            git push origin "HEAD:refs/heads/$branch"
          }
