# Production deploy (OVHcloud VPS) via Cloudflare Tunnel SSH.
#
# Every push to main deploys to the live instance: the runner SSHes through
# ssh.campfire.dill.moe (Cloudflare Tunnel -> sshd on the VPS), pulls main,
# and rebuilds the compose stack. Mirrors the manual runbook in AGENTS.md.
#
# One-time setup (owner, from a machine that can reach the VPS):
#   1. ssh-keygen -t ed25519 -f ~/.ssh/campfire-deploy -N "" -C "github-actions-campfire-deploy"
#   2. Append the PUBLIC key to /root/.ssh/authorized_keys on the VPS.
#   3. Add the PRIVATE key as a repo secret named DEPLOY_SSH_KEY
#      (Settings -> Secrets and variables -> Actions -> New repository secret).

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: campfire-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Set up deploy SSH key
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is not set. See the setup notes at the top of this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/campfire-deploy
          chmod 600 ~/.ssh/campfire-deploy
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.campfire.dill.moe
            User root
            IdentityFile ~/.ssh/campfire-deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy (git pull + compose up --build)
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=60 ssh.campfire.dill.moe \
            'set -euo pipefail; cd /opt/campfire/app && git pull --ff-only && docker compose -f docker-compose.yml -f deploy/ovh/docker-compose.ovh.yml up -d --build'

      - name: Confirm services are up
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=60 ssh.campfire.dill.moe \
            'cd /opt/campfire/app && docker compose -f docker-compose.yml -f deploy/ovh/docker-compose.ovh.yml ps'

      - name: Confirm live site serves the new build
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://campfire.dill.moe/api/version; then
              echo; echo "Live site responded."
              exit 0
            fi
            echo "Attempt $i: site not ready yet, waiting 20s..."
            sleep 20
          done
          echo "::error::campfire.dill.moe/api/version did not respond after deploy."
          exit 1
