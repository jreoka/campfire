<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campfire — self-hosted chat + voice</title>
<meta name="description" content="Campfire: a tiny self-hosted chat + voice app. Create servers, chat, and hop into voice rooms. Installable PWA." />
<meta name="theme-color" content="#1a1d29" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Campfire" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">

  <!-- AUTH VIEW -->
  <section id="view-auth" class="view">
    <div class="auth-card">
      <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="4" width="36" height="26" rx="8" fill="#5865f2"/><path d="M12 29l-4 7 11-7z" fill="#5865f2"/><circle cx="13" cy="17" r="2.4" fill="#fff"/><circle cx="20" cy="17" r="2.4" fill="#fff"/><circle cx="27" cy="17" r="2.4" fill="#fff"/></svg></div>
      <h1>Campfire</h1>
      <p class="muted">Your own tiny chat + voice server.<br/>Host it. Invite friends. Hang out.</p>
      <div class="tabs">
        <button id="tab-login" class="tab active">Log in</button>
        <button id="tab-register" class="tab">Sign up</button>
      </div>
      <form id="form-auth">
        <label>Username
          <input id="in-username" name="username" autocomplete="username" maxlength="24" placeholder="e.g. nova" required />
        </label>
        <label id="wrap-display" class="hidden">Display name
          <input id="in-display" name="display" autocomplete="nickname" maxlength="32" placeholder="Nova" />
        </label>
        <label>Password
          <input id="in-password" type="password" autocomplete="current-password" placeholder="••••••" required />
        </label>
        <p id="auth-error" class="error hidden"></p>
        <button class="btn primary big" type="submit" id="btn-auth">Log in</button>
      </form>
      <p class="muted small">First user? Just sign up — then create a server and share the invite code.</p>
    </div>
  </section>

  <!-- MAIN VIEW -->
  <section id="view-main" class="view hidden">
    <!-- server rail -->
    <nav id="rail" aria-label="Servers">
      <div id="server-list"></div>
      <button id="btn-add-server" title="Create or join a server">＋</button>
    </nav>

    <!-- channel sidebar -->
    <aside id="sidebar">
      <div id="server-header">
        <strong id="server-name">—</strong>
        <div class="row">
          <button id="btn-invite" class="chip" title="Show invite code">Invite</button>
          <button id="btn-server-menu" class="chip" title="Server settings">···</button>
        </div>
      </div>
      <div class="chan-group-label">TEXT CHANNELS</div>
      <div id="text-channels"></div>
      <div class="chan-group-label row-between">VOICE ROOMS <button id="btn-add-voice" class="mini" title="New voice room">＋</button></div>
      <div id="voice-channels"></div>
      <div class="spacer"></div>
      <div id="me-card">
        <span id="me-avatar" class="avatar">?</span>
        <span id="me-name">—</span>
        <button id="btn-logout" class="mini" title="Log out">⏻</button>
      </div>
      <div id="voice-bar" class="hidden">
        <span id="voice-status"><span class="live-dot"></span><b id="voice-chan-name">—</b></span>
        <span class="row">
          <button id="btn-mute" class="mini" title="Mute">Mute</button>
          <button id="btn-voice-leave" class="mini danger" title="Disconnect">✕</button>
        </span>
      </div>
    </aside>
    <div id="sidebar-scrim"></div>

    <!-- chat -->
    <main id="chat">
      <header id="chat-header">
        <button id="btn-menu" class="icon-btn">☰</button>
        <span id="chan-hash">#</span><strong id="chan-name">general</strong>
        <span id="typing" class="muted"></span>
        <span class="spacer"></span>
        <button id="btn-join-voice" class="btn small hidden">Join voice</button>
      </header>

      <div id="voice-grid" class="hidden"></div>

      <div id="messages"></div>

      <form id="composer">
        <input id="in-message" autocomplete="off" maxlength="2000" placeholder="Message #general" />
        <button class="btn primary" type="submit">Send</button>
      </form>
    </main>

    <!-- members -->
    <aside id="members">
      <div class="chan-group-label">ONLINE — <span id="online-count">0</span></div>
      <div id="member-list"></div>
    </aside>
  </section>
</div>

<!-- modals -->
<div id="modal-backdrop" class="hidden">
  <div class="modal">
    <h3 id="modal-title">Create a server</h3>
    <div id="modal-body"></div>
    <div class="row end">
      <button id="modal-close" class="btn">Cancel</button>
      <button id="modal-ok" class="btn primary">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
