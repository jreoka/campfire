# Campfire on a single OVHcloud VPS - ingress and TURN alongside the app.
#
#   cd /opt/campfire/app
#   docker compose -f docker-compose.yml -f deploy/ovh/docker-compose.ovh.yml up -d
#
# The base docker-compose.yml is unchanged: db + clamav + campfire. This overlay
# adds the two services the app needs beside them, and nothing else:
#
#   cloudflared  the site's only ingress. Outbound-only, so ufw never opens
#                80/443. Its tunnel routes campfire.dill.moe -> http://campfire:3000
#   coturn       the TURN relay, on the host network so it binds the VPS's public
#                IP directly - which is why there is no port mapping here
#
# The scanner is the `clamav` service in the base file, not here: it is part of
# the app's function, so a self-hosted deployment of any shape gets it. It is
# never published to the host - the app reaches it by service name on the compose
# network - and its signature database lives in the `clamdb` volume.
#
# Not here: Caddy. TLS terminates at Cloudflare, and the base overlay for a
# direct-TLS VPS (docker-compose.prod.yml) is a different, unused shape.

services:
  campfire:
    # A single host has no kubelet to arbitrate, so a runaway encode or a burst
    # of uploads must not be able to take Postgres down with it. S3 mode buffers
    # every upload in RAM (MAX_FILE_MB=50 across VIRUS_SCAN_CONCURRENCY slots)
    # and the compressor holds more while ffmpeg runs, so this is headroom rather
    # than a target. Tightened from 2g when the scanner container arrived: the
    # host has 4 GB and 1g (db) + 1.5g (clamav) + 1.5g (app) is what fits.
    mem_limit: 1500m

  db:
    mem_limit: 1g

  # Measured, not guessed: a loaded clamd holds ~1.02 GiB of signatures and
  # scans a 50 MB stream in ~3.6s without moving that number (see the note in
  # deploy/ovh/README.md). 1.5g covers the daemon with room for a large nested
  # scan, and is the third share of the box's 4 GB.
  clamav:
    mem_limit: 1500m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: campfire-cloudflared
    restart: unless-stopped
    # --no-autoupdate: the image tag is the version we pin; a self-updating
    # binary inside a container just makes the running version unknowable.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - campfire

  coturn:
    image: coturn/coturn:latest
    container_name: campfire-coturn
    restart: unless-stopped
    # host networking: the relay must present the VPS's real public address to
    # peers, and its relay range (49160-49200/udp) is a host port range. Same
    # reasoning as the cluster's `hostNetwork: true`.
    network_mode: host
    environment:
      - TURN_USER=${TURN_USER:?Set TURN_USER in .env}
      - TURN_PASS=${TURN_PASS:?Set TURN_PASS in .env}
    volumes:
      - ./deploy/ovh/coturn/turnserver.conf:/etc/coturn-base/turnserver.conf:ro
    # coturn reads exactly ONE config file, and the credential is a secret, so
    # render base + user line into a temp file at start - the same trick the
    # cluster used with a ConfigMap + emptyDir. `$$` is a literal $ for the
    # container's shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cat /etc/coturn-base/turnserver.conf > /tmp/turnserver.conf &&
        printf 'user=%s:%s\n' "$$TURN_USER" "$$TURN_PASS" >> /tmp/turnserver.conf &&
        exec turnserver -c /tmp/turnserver.conf --pidfile= --no-cli
