# coturn relay config for the single-VPS deployment.
#
# The `user=` line is NOT here - it is appended at container start from
# TURN_USER / TURN_PASS (.env), because coturn reads exactly one config file and
# the credential must not live in the repo.
#
# This file is bind-mounted read-only at /etc/coturn-base/turnserver.conf; the
# compose entrypoint concatenates it with the credential into /tmp and runs from
# there.

realm=campfire.dill.moe
server-name=campfire.dill.moe

# The VPS's public IPv4 is on eth0, so coturn advertises the address it listens
# on and needs no external-ip - same as the cluster's hostNetwork pod.
listening-ip=0.0.0.0
listening-port=3478
alt-listening-port=3479

# Relay port range. ufw opens exactly this range (49160:49200/udp).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
total-quota=100
bps-cap=262144
stale-nonce=600

# Never relay to private space: a TURN server that will reach 10/8 or 192.168/16
# is an SSRF pivot into whatever network it sits on.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Log to stdout so `docker logs campfire-coturn` shows the relay. The cluster
# wrote to a file inside the pod instead, which is the one thing a container
# host does differently.
simple-log
